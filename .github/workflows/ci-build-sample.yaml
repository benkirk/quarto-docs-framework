name: Check Conda-based Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Login shell so setup-miniconda's activation hook in ~/.bash_profile
# fires at the start of every `run:` step. Without this, GHA defaults
# to `bash -e {0}` (non-login) and `conda activate ./conda-env/` never
# happens -- subsequent steps see system python instead of the env.
defaults:
  run:
    shell: bash -el {0}

jobs:
  pytest:
    name: Build Samples
    # Skip on [skip ci] / [ci skip] / [no ci] in commit message or PR title
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    # A wedged render (see the Chromium step below) should fail fast,
    # not burn the 6-hour job limit.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ./conda-env/
          environment-file: conda-env.yaml
          # Miniforge + mamba so the env solve uses libmamba (~minutes
          # instead of >15 with the classic conda solver on this stack).
          miniforge-version: latest
          use-mamba: true

      # setup-miniconda installs everything in conda-env.yaml (incl.
      # bash_kernel) but doesn't run `python -m bash_kernel.install` —
      # that's the Makefile's post-create step. Do it explicitly so
      # executable {bash} chunks have a kernel to dispatch to.
      - name: Register bash Jupyter kernel
        run: python -m bash_kernel.install --sys-prefix

      # Quarto renders mermaid diagrams through headless Chromium.
      # Ubuntu 24.04 runner images restrict unprivileged user namespaces
      # via AppArmor, which deadlocks Chromium's sandbox -- the render
      # hangs forever right after cell execution (orphaned chrome +
      # chrome_crashpad_handler processes at job cleanup). Lift the
      # restriction so the sandbox can start.
      - name: Allow unprivileged user namespaces (Chromium/mermaid)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sanity-check activation
        run: |
          which python quarto 2>/dev/null || true
          conda info --envs

      - name: Build Sample PPTX
        run: |
          make -C docs/sample

      - name: Upload sample.pptx artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-pptx
          path: docs/sample/sample.pptx
          if-no-files-found: error
          retention-days: 14

      - name: Build Sample HTML
        run: |
          make -C docs/sample sample.html

      - name: Upload sample.html artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-html
          path: |
            docs/sample/sample.html
            docs/sample/sample_files/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: true
