name: Check Conda-based Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Login shell so setup-miniconda's activation hook in ~/.bash_profile
# fires at the start of every `run:` step. Without this, GHA defaults
# to `bash -e {0}` (non-login) and `conda activate ./conda-env/` never
# happens -- subsequent steps see system python instead of the env.
defaults:
  run:
    shell: bash -el {0}

jobs:
  pytest:
    name: Build Samples
    # Skip on [skip ci] / [ci skip] / [no ci] in commit message or PR title
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !contains(github.event.head_commit.message, '[ci skip]')
      && !contains(github.event.head_commit.message, '[no ci]')
      && !contains(github.event.pull_request.title, '[skip ci]')
      && !contains(github.event.pull_request.title, '[ci skip]')
      && !contains(github.event.pull_request.title, '[no ci]')
    runs-on: ubuntu-latest
    # A wedged render (see the Chromium step below) should fail fast,
    # not burn the 6-hour job limit.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ./conda-env/
          environment-file: conda-env.yaml
          # Miniforge + mamba so the env solve uses libmamba (~minutes
          # instead of >15 with the classic conda solver on this stack).
          miniforge-version: latest
          use-mamba: true

      # setup-miniconda installs everything in conda-env.yaml (incl.
      # bash_kernel) but doesn't run `python -m bash_kernel.install` —
      # that's the Makefile's post-create step. Do it explicitly so
      # executable {bash} chunks have a kernel to dispatch to.
      - name: Register bash Jupyter kernel
        run: python -m bash_kernel.install --sys-prefix

      # Quarto renders mermaid diagrams through a headless browser. The
      # runner's system Chrome wedges quarto's discovery/handshake (runs
      # hang forever right after cell execution, leaving orphaned chrome
      # + chrome_crashpad_handler processes; lifting the AppArmor userns
      # restriction did not help), so install quarto's own managed
      # Chrome Headless Shell, which it prefers when present.
      - name: Install Chrome Headless Shell (mermaid rendering)
        run: quarto install chrome-headless-shell --no-prompt

      - name: Sanity-check activation
        run: |
          which python quarto 2>/dev/null || true
          conda info --envs

      # timeout: a wedged browser render should fail here in minutes,
      # with diagnostics, rather than hitting the job-level cap.
      # Quarto only treats YAML as front matter when it is the very first
      # thing in the file; anything above it (e.g. an editor mode-line)
      # leaves `date: last-modified` unresolved (#7).
      - name: Check deck front matter starts on line 1
        run: |
          bad=0
          for f in docs/*/*.qmd; do
            case "$(basename "$f")" in _*) continue ;; esac   # included fragments
            first=$(head -n1 "$f")
            if [ "$first" = "---" ]; then
              echo "ok    $f"
            else
              echo "FAIL  $f: line 1 is '$first', expected '---'"
              echo "::error file=$f,line=1::front matter must start on line 1"
              bad=1
            fi
          done
          # not `exit $bad`: in this login shell (bash -el) `exit` runs
          # ~/.bash_logout, whose last status (1 on the runner) replaces ours
          test "$bad" -eq 0

      - name: Build Sample PPTX
        run: |
          timeout 600 make -C docs/sample || {
            echo '::error::sample pptx render timed out or failed'
            ps aux | grep -i chrom | grep -v grep || true
            exit 1
          }

      - name: Check dates resolved in sample.pptx
        run: |
          if unzip -p docs/sample/sample.pptx 'ppt/slides/*.xml' | grep -q '<a:t>last-modified</a:t>'; then
            echo '::error::sample.pptx contains a literal "last-modified" date (#7)'
            exit 1
          fi

      - name: Upload sample.pptx artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-pptx
          path: docs/sample/sample.pptx
          if-no-files-found: error
          retention-days: 14

      - name: Build Sample HTML
        run: |
          make -C docs/sample sample.html

      # the NCAR revealjs theme applied: its fonts/logos dependency is attached
      # and the Lua filter drew the waves (a stock revealjs render has neither)
      - name: Check sample.html carries the NCAR theme
        run: |
          cd docs/sample
          grep -q 'ncar-revealjs.css' sample.html
          grep -q 'class="ncar-waves"' sample.html
          ls sample_files/libs/quarto-contrib/ncar-revealjs-*/Poppins-Bold.ttf

      - name: Upload sample.html artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-html
          path: |
            docs/sample/sample.html
            docs/sample/sample_files/
          if-no-files-found: error
          retention-days: 14

      # beamer PDF via the vendored NCAR theme; TinyTeX installs missing
      # LaTeX packages on the fly (fonts and logos ship with the theme)
      - name: Install TinyTeX (beamer PDF)
        run: quarto install tinytex --no-prompt

      - name: Build Sample PDF
        run: |
          timeout 600 make -C docs/sample sample.pdf

      - name: Upload sample.pdf artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdf
          path: docs/sample/sample.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: true
