name: quarto_docs
channels:
  - conda-forge
dependencies:
  # Binaries / runtime — must come from conda.
  - python
  - quarto >=1.6   # ncar-beamer's Lua filter uses \pandocbounded (pandoc >= 3.2.1)
  - gh
  - make
  - pip
  - poppler      # pdftoppm / pdftotext, for `make qa`
  # Pure-python deps install much faster as wheels via pip than via the
  # conda solver, and don't add to the solve graph.
  - pip:
      - bash_kernel
      - ipykernel
      - jupyter_client
      - nbclient
      - nbformat
      - pillow        # `make qa` contact sheets
      - pipdeptree
      - playwright    # `make qa` HTML checks (Makefile installs its headless Chromium)
      - python-pptx
      - pyyaml
